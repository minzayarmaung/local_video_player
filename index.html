<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Video Player</title>
  <style>
    :root { color-scheme: dark; --bg: #101217; --surface: #191d25; --surface-2: #242a35; --line: #353d4b; --text: #f5f7fb; --muted: #9aa5b5; --accent: #6d8cff; --accent-strong: #88a1ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at top, #20283a 0, var(--bg) 46%); color: var(--text); font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .player { width: min(100%, 1040px); overflow: hidden; border: 1px solid rgba(255,255,255,.09); border-radius: 20px; background: var(--surface); box-shadow: 0 28px 80px rgba(0,0,0,.38); }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.02em; }
    .brand-mark { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; color: white; background: var(--accent); font-size: 12px; }
    .file-name { min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .stage { position: relative; display: grid; min-height: min(59vw, 585px); background: #050607; }
    video { width: 100%; max-height: 585px; margin: auto; display: none; background: #050607; }
    .dropzone { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; transition: background .2s, border .2s; }
    .dropzone.dragging { background: rgba(109,140,255,.12); outline: 2px dashed var(--accent); outline-offset: -14px; }
    .drop-content { max-width: 390px; }
    .drop-icon { width: 62px; height: 62px; margin: 0 auto 18px; display: grid; place-items: center; border: 1px solid #46516a; border-radius: 18px; color: var(--accent-strong); font-size: 28px; }
    h1 { margin: 0 0 8px; font-size: clamp(22px, 3vw, 31px); letter-spacing: -.04em; }
    .drop-content p { margin: 0 0 22px; color: var(--muted); }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 15px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; color: white; background: var(--accent); font: inherit; font-weight: 650; transition: transform .15s, background .15s; }
    .button:hover { background: #7c98ff; transform: translateY(-1px); }
    .hint { margin-top: 14px; color: #788496; font-size: 12px; }
    .controls { display: none; padding: 14px 17px 17px; background: #161a22; }
    .timeline-row { display: flex; align-items: center; gap: 11px; }
    .time { flex: 0 0 94px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    input[type="range"] { height: 4px; accent-color: var(--accent); cursor: pointer; }
    #progress { width: 100%; }
    .button-row { display: flex; align-items: center; gap: 8px; margin-top: 13px; }
    .icon-button { width: 36px; height: 36px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 8px; cursor: pointer; color: var(--text); background: transparent; font-size: 17px; }
    .icon-button:hover { background: var(--surface-2); }
    .volume { width: 98px; }
    select { margin-left: auto; min-height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; outline: 0; color: var(--text); background: var(--surface-2); font: inherit; font-size: 13px; cursor: pointer; }
    .error { position: absolute; left: 50%; bottom: 23px; z-index: 4; width: min(92%, 590px); padding: 11px 14px; transform: translateX(-50%); border: 1px solid #914b54; border-radius: 9px; color: #ffdbe0; background: #402129; text-align: center; font-size: 13px; }
    .hidden { display: none !important; }
    @media (max-width: 580px) { body { padding: 12px; } .player { border-radius: 14px; } .topbar { padding: 13px 14px; } .file-name { max-width: 135px; } .stage { min-height: 66vw; } .controls { padding: 12px; } .time { flex-basis: 82px; } .volume { width: 65px; } }
  </style>
</head>
<body>
  <main class="player">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">▶</span> Mini Video Player</div>
      <div class="file-name" id="fileName">No video loaded</div>
    </header>
    <section class="stage" id="stage">
      <video id="video" playsinline preload="metadata"></video>
      <div class="dropzone" id="dropzone">
        <div class="drop-content">
          <div class="drop-icon">▱</div>
          <h1>Open a local video</h1>
          <p>Drop a video file here, or choose one from your device.</p>
          <button class="button" id="browseButton" type="button">Choose video</button>
          <input class="hidden" id="fileInput" type="file" accept="video/*,.mkv,.avi,.ogv" />
          <div class="hint">MP4, WebM, OGG, MKV, AVI and more — subject to your browser’s codecs.</div>
        </div>
      </div>
      <div class="error hidden" id="error" role="alert"></div>
    </section>
    <section class="controls" id="controls" aria-label="Video controls">
      <div class="timeline-row">
        <input id="progress" type="range" min="0" max="100" value="0" step="0.01" aria-label="Seek" />
        <span class="time" id="time">0:00 / 0:00</span>
      </div>
      <div class="button-row">
        <button class="icon-button" id="playButton" type="button" aria-label="Play">▶</button>
        <button class="icon-button" id="muteButton" type="button" aria-label="Mute">🔊</button>
        <input class="volume" id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
        <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
        <button class="icon-button" id="fullscreen" type="button" aria-label="Fullscreen">⛶</button>
      </div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const video = $('video'), stage = $('stage'), dropzone = $('dropzone'), input = $('fileInput');
    const controls = $('controls'), error = $('error'), fileName = $('fileName');
    let objectUrl = null;
    const formatTime = seconds => { if (!Number.isFinite(seconds)) return '0:00'; const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60).toString().padStart(2, '0'); return `${m}:${s}`; };
    const showError = message => { error.textContent = message; error.classList.remove('hidden'); };
    const clearError = () => error.classList.add('hidden');
    function loadFile(file) {
      if (!file) return;
      if (!file.type.startsWith('video/') && !/\.(mp4|webm|ogv|ogg|mkv|avi)$/i.test(file.name)) { showError('Please select a video file.'); return; }
      clearError();
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      video.src = objectUrl; video.load();
      fileName.textContent = file.name;
    }
    $('browseButton').onclick = () => input.click();
    input.onchange = e => loadFile(e.target.files[0]);
    ['dragenter', 'dragover'].forEach(type => stage.addEventListener(type, e => { e.preventDefault(); dropzone.classList.add('dragging'); }));
    ['dragleave', 'drop'].forEach(type => stage.addEventListener(type, e => { e.preventDefault(); dropzone.classList.remove('dragging'); }));
    stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
    video.addEventListener('loadedmetadata', () => {
      dropzone.classList.add('hidden');
      video.style.display = 'block';
      controls.style.display = 'block';
      // Let the user start playback: browsers often block or silence audio from autoplay.
      video.muted = false;
      video.defaultMuted = false;
      video.volume = 1;
      $('volume').value = 1;
      updateMute();
      $('time').textContent = `0:00 / ${formatTime(video.duration)}`;
    });
    video.addEventListener('error', () => { const name = fileName.textContent; showError(`“${name}” can’t be played in this browser. The file may use an unsupported codec. Try MP4 (H.264/AAC) or WebM.`); });
    video.addEventListener('timeupdate', () => { const p = video.duration ? video.currentTime / video.duration * 100 : 0; $('progress').value = p; $('time').textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`; });
    video.addEventListener('play', () => { $('playButton').textContent = '❚❚'; $('playButton').ariaLabel = 'Pause'; });
    video.addEventListener('pause', () => { $('playButton').textContent = '▶'; $('playButton').ariaLabel = 'Play'; });
    const playWithSound = () => {
      video.muted = false;
      video.defaultMuted = false;
      if (video.volume === 0) { video.volume = 1; $('volume').value = 1; }
      updateMute();
      return video.play().catch(() => showError('Playback was blocked by the browser. Click Play again, then check that this tab is not muted.'));
    };
    $('playButton').onclick = () => video.paused ? playWithSound() : video.pause();
    video.ondblclick = () => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen();
    $('progress').oninput = e => { if (video.duration) video.currentTime = e.target.value / 100 * video.duration; };
    $('volume').oninput = e => { video.volume = e.target.value; video.muted = e.target.value == 0; updateMute(); };
    const updateMute = () => { $('muteButton').textContent = (video.muted || video.volume === 0) ? '🔇' : '🔊'; };
    $('muteButton').onclick = () => { video.muted = !video.muted; updateMute(); };
    $('speed').onchange = e => video.playbackRate = Number(e.target.value);
    $('fullscreen').onclick = () => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen();
    document.addEventListener('keydown', e => { if (e.target.matches('input, select')) return; if (e.code === 'Space' && video.src) { e.preventDefault(); video.paused ? playWithSound() : video.pause(); } if (e.key.toLowerCase() === 'f' && video.src) $('fullscreen').click(); });
    window.addEventListener('beforeunload', () => objectUrl && URL.revokeObjectURL(objectUrl));
  </script>
</body>
</html>
